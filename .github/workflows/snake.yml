name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate neon green snake
        uses: Platane/snk@v3
        with:
          github_user_name: Shubhithebeast
          outputs: |
            github-contribution-grid-snake.svg?color_snake=%2339FF14&color_dots=%230D2818,%23006B32,%2300A844,%2339FF14,%237CFF6B
            github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339FF14&color_dots=%230D2818,%23006B32,%2300A844,%2339FF14,%237CFF6B

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
